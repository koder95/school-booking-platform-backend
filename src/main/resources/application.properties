spring.application.name=School Booking Platform Backend
spring.profiles.default=development
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
server.port=8080
server.forward-headers-strategy=framework
spring.liquibase.enabled=true

jwt.expiration=${JWT_EXPIRATION}
jwt.secret=${JWT_SECRET}
magic-link.base-url=${MAGIC_LINK_BASE_URL}
magic-link.frontend-endpoint=${MAGIC_LINK_FRONTEND_ENDPOINT}
magic-link.paramName=${MAGIC_LINK_PARAM_NAME}
sbp.cors.allowed-origins=${SBP_CORS_ALLOWED_ORIGINS}
sbp.backend.version=@project.version@

spring.mail.host=${SMTP_SERVER}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH_REQ}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_AUTH_STARTTLS}
spring.mail.transport.protocol=smtp
