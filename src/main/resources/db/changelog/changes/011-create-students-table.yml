databaseChangeLog:
  - changeSet:
      id: 011-create-students-table
      author: Koder95
      changes:
        - createTable:
            tableName: students
            columns:
              - column:
                  name: uuid
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email_id
                  type: bigint
                  constraints:
                    unique: true
                    nullable: false
                    foreignKeyName: fk_students_email_id
                    references: emails(id)
              - column:
                  name: zone_id
                  type: varchar(64)
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
