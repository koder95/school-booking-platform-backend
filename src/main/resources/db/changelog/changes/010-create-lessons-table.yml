databaseChangeLog:
  - changeSet:
      id: 010-create-lessons-table
      author: Koder95
      changes:
        - createTable:
            tableName: lessons
            columns:
              - column:
                  name: uuid
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: assigned_uuid
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_lessons_teacher_uuid
                    references: teachers(uuid)
              - column:
                  name: subject_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_lessons_subject_id
                    references: subjects(id)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: start_time
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: closing_time
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: max_enrolled
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
